<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>BEST Bus</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <main class="login-page">

        <!-- BRAND SIDE -->

        <section class="brand-side">

            <div class="brand-content">

                <div class="brand-logo">
                    BEST
                </div>

                <div class="brand-accent"></div>

                <h2>
                    Bus Management
                    <br>
                    System
                </h2>

                <p>
                    Simple. Secure. Connected.
                </p>

            </div>

            <div class="brand-bottom">
                Fleet management made simple.
            </div>

        </section>


        <!-- LOGIN SIDE -->

        <section class="login-side">

            <div class="login-box">

                <!-- MOBILE LOGO -->

                <div class="mobile-logo">
                    BEST
                </div>


                <!-- HEADER -->

                <div class="login-header">

                    <span class="small-label">
                        BEST BUS
                    </span>

                    <h1>
                        Welcome back.
                    </h1>

                    <p>
                        Sign in to continue.
                    </p>

                </div>


                <!-- FORM -->

                <form
                    id="loginForm"
                    autocomplete="on"
                >

                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="name@example.com"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >

                                <svg
                                    id="eyeOpen"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- ERROR -->

                    <div
                        id="errorMessage"
                        class="error-message"
                    ></div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >

                        <span id="buttonText">
                            Sign in
                        </span>

                        <span
                            id="buttonSpinner"
                            class="spinner hidden"
                        ></span>

                    </button>

                </form>


                <!-- SECURITY -->

                <div class="security">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        />

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        />

                    </svg>

                    <span>
                        Secure account access
                    </span>

                </div>


                <div class="footer">
                    BEST Bus Management System
                </div>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="./script.js"
    ></script>

</body>

</html>
